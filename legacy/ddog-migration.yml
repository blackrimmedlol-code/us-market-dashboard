name: DDOG migration verification

on:
  push:
    paths:
      - '.github/workflows/ddog-migration.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair stale migration test assumptions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'market-model.test.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace("const result = model.completion(stale, 'close', '2026-09-04');", "const result = model.completion(stale, 'close', data.close.sessionDate);");
          s = s.replace("const bad = structuredClone(data), call = structuredClone(data.decisionLedger[0]); call.callId += '-unplanned'; bad.decisionLedger.push(call);", "const bad = structuredClone(data), call = structuredClone(data.decisionLedger[0]); call.callId += '-unplanned'; delete call.evaluationPlan; bad.decisionLedger.push(call);");
          fs.writeFileSync(p, s);
          NODE
      - name: Validate v16 and run full tests
        run: |
          node --check market-model.js
          node --check validate-data.mjs
          node validate-data.mjs data.json
          node --test market-model.test.mjs
      - name: Commit test repairs
        run: |
          if git diff --quiet -- market-model.test.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-model.test.mjs
          git commit -m 'Fix DDOG migration regression tests'
          git push
