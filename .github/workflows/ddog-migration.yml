name: DDOG core migration

on:
  push:
    paths:
      - '.github/workflows/ddog-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate CIEN core slot to DDOG
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sessions = ['premarket','intraday','late','close'];
          const targets = ['DRAM','LITE','CRDO','DDOG','IREN','BE','SPCX','MSTR'];
          const changeOrder = ['市场', ...targets];
          const actionOrder = ['市场', ...targets];
          const snapshotOrder = ['SPY','QQQ','SOXX',...targets,'BTC'];
          const migrationDate = '2026-09-09';
          const migrationNote = '2026-09-09 起核心矩阵由 CIEN 切换为 DDOG；CIEN 历史判断与复盘冻结保留，DDOG 不继承 CIEN 的价格、触发、分位或胜负。';

          const raw = fs.readFileSync('data.json','utf8');
          fs.mkdirSync('history/migrations', {recursive:true});
          const archive = 'history/migrations/2026-09-09-pre-ddog-data.json';
          if (!fs.existsSync(archive)) fs.writeFileSync(archive, raw);
          const data = JSON.parse(raw);

          function reorder(arr, order, field) {
            const rank = new Map(order.map((x,i)=>[x,i]));
            return (arr || []).slice().sort((a,b)=>(rank.get(a?.[field]) ?? 999) - (rank.get(b?.[field]) ?? 999));
          }
          function changeFor(key) {
            return {
              asset:'DDOG',
              from:'迁移前未纳入核心矩阵',
              to:key === 'close' ? '建立 09/08 正式收盘参考基线' : '等待下一有效时段建立前瞻基线',
              reason:migrationNote,
              material:true,
              impactFields:['confidence','permissions'],
              tone:'flat',
              verdict:'DDOG 新纳入核心矩阵；PANW / MDB 仅作软件同行温度计，本时段不回填 CIEN 数据。'
            };
          }
          function horizonFor(key) {
            return {
              short:{
                bias:'中性',
                posture:'新纳入核心矩阵，等待独立基线',
                driver:key === 'close' ? '09/08 正式收盘 210.23 仅作为迁移参考价；尚未建立事前 DDOG 触发条件。PANW / MDB 仅作软件同行温度计。' : '该时段发生在 DDOG 纳入核心矩阵之前，不回填价格或技术判断。',
                trigger:'等待下一有效交易时段取得 DDOG 独立价格结构、量能与 PANW / MDB 同行证据后再冻结触发条件。',
                invalidation:'前瞻基线建立前不开放新增风险权限；不得用 CIEN 历史条件替代。',
                planStatus:'等待触发',
                tradeType:'仅观察',
                confidence:'低',
                setupLabel:'AI软件 / Observability 新基线',
                stateNote:'DDOG 自 2026-09-09 起进入核心矩阵；历史不倒填。',
                holdingPlan:'若已有 DDOG 持仓，仅将 09/08 正式收盘作为参考锚；等待新时段建立独立防守条件。',
                entryPlan:'迁移阶段不新增；等待下一有效时段形成并冻结前瞻条件。',
                confirmations:{
                  price:{state:'unknown',note:'迁移时不倒签价格结构确认。'},
                  volume:{state:'unknown',note:'迁移时不倒签量能确认；需下一有效时段建立可审计比较基准。'},
                  linkage:{state:'unknown',note:'PANW / MDB 仅作软件同行温度计，需下一有效时段重新核验。'}
                }
              },
              medium:{
                bias:'中性',
                posture:'验证 AI/云工作负载向平台使用量与现金流的兑现',
                driver:'重点跟踪 AI 与非 AI 云工作负载、Observability + Security 平台扩张、消费型收入、$100k+ ARR 大客户扩张及 FCF/利润率质量；PANW / MDB 只作同行温度计。',
                trigger:'收入与大客户扩张维持强势，平台 attach 与 AI 产品采用继续兑现，同时利润/FCF 不恶化。',
                invalidation:'云优化或消费增速持续降档、平台扩张失速，或高估值与盈利兑现明显背离。'
              },
              permissions:{chase:'关闭',overnight:'关闭',beta:'0'}
            };
          }
          function matrixFor() {
            return {asset:'DDOG',fundamental:'0',macro:'0',positioning:'0',price:'0',verdict:'新纳入核心矩阵，等待独立前瞻基线；PANW / MDB 为同行温度计。'};
          }
          function oddsFor(window) {
            return {asset:'DDOG',window,percentile:null,sampleSize:0,asOf:null,referencePrice:null,rangeLow:null,rangeHigh:null,basis:'DDOG 独立历史待刷新',source:'pending',sourceUrl:null,sampleOrigin:'migration',sampleNote:'2026-09-09 新纳入核心矩阵；不得继承 CIEN 历史分位，等待 DDOG 独立日线历史刷新。',historyFile:null};
          }
          function snapshotFor(key) {
            const close = key === 'close';
            return {symbol:'DDOG',name:'Datadog · AI软件 / Observability',price:close?210.23:null,changePct:close?-1.27:null,tone:close?'down':'flat',priceStatus:close?'正式收盘 · 09-09 04:00 中国时间（迁移参考基线）':'迁移占位 · 本时段未纳入'};
          }
          function demandLoop() {
            return [
              {key:'industryDemand',label:'产业需求',state:'等待新基线',tone:'flat',note:'跟踪 AI/云工作负载与企业可观测性、安全需求；不把 AI Capex 直接等同 DDOG 收入。'},
              {key:'ordersCommitments',label:'客户/承诺',state:'等待新基线',tone:'flat',note:'跟踪大客户扩张、平台采用和消费承诺；PANW / MDB 仅作同行温度计。'},
              {key:'deliveryUtilization',label:'使用/部署',state:'等待新基线',tone:'flat',note:'核验产品使用量、平台 attach、AI 产品采用与云消费，而非用股价替代。'},
              {key:'revenueConversion',label:'收入确认',state:'等待新基线',tone:'flat',note:'核验 usage/consumption 是否持续转化为收入增长及大型客户扩张。'},
              {key:'marginCashFlow',label:'利润/现金流',state:'等待新基线',tone:'flat',note:'跟踪 GAAP/Non-GAAP 利润、FCF、SBC 与经营杠杆，防止只看收入增速。'}
            ];
          }
          function watchFor(key) {
            const close = key === 'close';
            return {
              symbol:'DDOG',name:'Datadog · AI软件 / Observability',price:close?210.23:null,changePct:close?-1.27:null,tone:close?'down':'flat',priceStatus:close?'正式收盘 · 09-09 04:00 中国时间（迁移参考基线）':'迁移占位 · 本时段未纳入',
              support:'待下一有效时段建立',resistance:'待下一有效时段建立',supportValue:null,resistanceValue:null,
              invalidation:'前瞻基线建立前不开放新增风险权限；不得继承 CIEN 技术位。',
              priceAction:close?'09/08 正式 O/H/L/C 207.00 / 211.18 / 203.24 / 210.23，-1.27%；只作迁移参考，不计作事前判断。':'该时段发生在 DDOG 纳入之前，不倒填盘前/盘中结构。',
              relativeStrength:'软件同行温度计：PANW（Security 平台/企业安全支出）+ MDB（数据库/AI Data Layer）；二者不是核心八股。',
              fundamental:'核心观察 AI/云 workload、Observability + Security 平台扩张、消费型收入、大客户扩张、AI 产品采用与 FCF/利润率质量。',
              verdict:'DDOG 新纳入核心矩阵；等待下一有效时段建立独立前瞻基线。',
              timeframes:{'15m':'unknown','30m':'unknown','1h':'unknown','4h':'unknown','1d':'unknown'},
              timeframeMethods:{'15m':'structure','30m':'structure','1h':'structure','4h':'structure','1d':'daily'},
              timeframeNotes:{
                '15m':'迁移时不回填 15m 结构；下一有效时段重新获取。',
                '30m':'迁移时不回填 30m 结构；下一有效时段重新获取。',
                '1h':'迁移时不回填 1h 结构；下一有效时段重新获取。',
                '4h':'迁移时不回填 4h 结构；下一有效时段重新获取。',
                '1d':close?'09/08 正式日线仅作参考基线，不据此倒签交易条件。':'本时段发生在 DDOG 纳入之前。'
              },
              demandLoop:demandLoop()
            };
          }
          function quoteFor(key, sessionDate) {
            if (key === 'close') return {open:207.00,high:211.18,low:203.24,volume:5198974,price:210.23,status:'verified',asOf:'2026-09-09T04:00:00+08:00',marketDate:'2026-09-08',session:'regular',isFinal:true,source:'Forbes / S&P-Xignite historical OHLCV',sourceUrl:'https://www.forbes.com/companies/datadog/',maxAgeMinutes:150};
            return {open:null,high:null,low:null,volume:null,price:null,status:'missing',asOf:null,marketDate:sessionDate || '2026-09-08',session:key==='premarket'?'pre':'regular',isFinal:false,source:'migration placeholder',sourceUrl:null,maxAgeMinutes:150};
          }

          for (const key of sessions) {
            const b = data[key]; if (!b || b.available === false) continue;
            b.changes = reorder([...(b.changes||[]).filter(x=>!['CIEN','DDOG'].includes(x.asset)), changeFor(key)], changeOrder, 'asset');
            if (b.horizons) { delete b.horizons.CIEN; b.horizons.DDOG = horizonFor(key); }
            b.matrix = reorder([...(b.matrix||[]).filter(x=>!['CIEN','DDOG'].includes(x.asset)), matrixFor()], actionOrder, 'asset');
            b.odds = reorder([...(b.odds||[]).filter(x=>!['CIEN','DDOG'].includes(x.asset)), oddsFor('60D'), oddsFor('252D')], targets.flatMap(x=>[`${x}:60D`,`${x}:252D`]), '__none');
            // odds uses a composite order.
            const oddsRank = new Map(targets.flatMap(x=>[`${x}:60D`,`${x}:252D`]).map((x,i)=>[x,i]));
            b.odds.sort((a,c)=>(oddsRank.get(`${a.asset}:${a.window}`)??999)-(oddsRank.get(`${c.asset}:${c.window}`)??999));
            b.snapshot = reorder([...(b.snapshot||[]).filter(x=>!['CIEN','DDOG'].includes(x.symbol)), snapshotFor(key)], snapshotOrder, 'symbol');
            b.watchlist = reorder([...(b.watchlist||[]).filter(x=>!['CIEN','DDOG'].includes(x.symbol)), watchFor(key)], targets, 'symbol');
            if (b.quality?.quotes) { delete b.quality.quotes.CIEN; b.quality.quotes.DDOG = quoteFor(key,b.sessionDate); }
          }

          if (Array.isArray(data.snapshot)) data.snapshot = reorder([...data.snapshot.filter(x=>!['CIEN','DDOG'].includes(x.symbol)), snapshotFor('close')], snapshotOrder, 'symbol');

          const mediumDDOG = {
            asset:'DDOG',openedAt:migrationDate,updatedAt:migrationDate,
            thesis:'验证 AI/云工作负载增长能否持续转化为 Observability/Security 平台使用量、收入与高质量 FCF',
            evidenceFor:'新建基线：DDOG 作为核心 AI 软件/Observability 标的；重点看 workload、消费型收入、大客户、平台 attach 与 AI 产品采用。PANW / MDB 为同行温度计。',
            evidenceAgainst:'估值要求高；若云消费/大客户扩张降档、平台化不兑现或 SBC/利润质量恶化，软件高 Beta 可能快速压缩。',
            status:'观察',
            clocks:{
              technology:{state:'Observability + Security + AI',tone:'up',note:'跟踪平台化与 AI-native 产品采用，而非单一日志工具。'},
              commercialization:{state:'新基线',tone:'flat',note:'从 2026-09-09 起独立跟踪 usage、收入、大客户与平台 attach。'},
              financing:{state:'现金流质量待跟踪',tone:'flat',note:'重点核验 FCF、经营杠杆、SBC 与估值消化。'}
            }
          };
          data.mediumLedger = reorder([...(data.mediumLedger||[]).filter(x=>!['CIEN','DDOG'].includes(x.asset)), mediumDDOG], actionOrder, 'asset');

          data.meta.schemaVersion = 16;
          data.meta.maintenanceNote = 'v16：核心八股切换 DDOG；CIEN 历史冻结；PANW/MDB 为软件同行温度计';
          data.meta.coreMigration = {date:migrationDate,from:'CIEN',to:'DDOG',historyPolicy:'CIEN 历史判断/复盘冻结；DDOG 不继承 CIEN 数据',peerThermometer:['PANW','MDB']};
          data.meta.updateStatus = `${data.meta.updateStatus || ''}；v16 核心矩阵已切换 DDOG（不改变市场数据时点）`;
          fs.writeFileSync('data.json', JSON.stringify(data));

          // Shared model: new operational core and schema.
          let model = fs.readFileSync('market-model.js','utf8');
          model = model.replace('var SCHEMA = 15;', 'var SCHEMA = 16;')
            .replace("var TARGETS = ['DRAM', 'LITE', 'CIEN', 'CRDO', 'IREN', 'BE', 'SPCX', 'MSTR'];", "var TARGETS = ['DRAM', 'LITE', 'CRDO', 'DDOG', 'IREN', 'BE', 'SPCX', 'MSTR'];")
            .replaceAll('schema 必须为 v15','schema 必须为 v16');
          fs.writeFileSync('market-model.js', model);

          // Validator: current operational core is DDOG; legacy CIEN is accepted only in historical ledgers/reviews/events/issues.
          let validator = fs.readFileSync('validate-data.mjs','utf8');
          validator = validator.replace("const actionOrder = ['MARKET', ...targetOrder];", "const actionOrder = ['MARKET', ...targetOrder];\nconst legacyReviewOrder = ['MARKET', 'DRAM', 'LITE', 'CIEN', 'CRDO', 'IREN', 'BE', 'SPCX', 'MSTR'];\nconst legacyAssets = new Set(['CIEN']);\nconst historicalAssetAllowed = (asset) => actionOrder.includes(asset) || legacyAssets.has(asset);")
            .replace("const fundamentalLoopAssets = new Set(['DRAM', 'LITE', 'CIEN', 'CRDO', 'IREN', 'BE']);", "const fundamentalLoopAssets = new Set(['DRAM', 'LITE', 'CRDO', 'DDOG', 'IREN', 'BE']);")
            .replace("fail('meta.schemaVersion', '必须为 15')", "fail('meta.schemaVersion', '必须为 16')")
            .replace('issue.assets.every(a => actionOrder.includes(a))', 'issue.assets.every(a => historicalAssetAllowed(a))')
            .replace('event.affectedAssets.every((asset) => actionOrder.includes(asset))', 'event.affectedAssets.every((asset) => historicalAssetAllowed(asset))')
            .replace('if (!actionOrder.includes(call.asset))', 'if (!historicalAssetAllowed(call.asset))')
            .replace("const latestReviewAssets = (data.reviews?.[0]?.assets || []).map((item) => item.asset === '市场' ? 'MARKET' : item.asset);\nif (JSON.stringify(latestReviewAssets) !== JSON.stringify(actionOrder)) fail('reviews[0].assets', `顺序必须为 MARKET / ${targetOrder.join(' / ')}`);", "const latestReviewAssets = (data.reviews?.[0]?.assets || []).map((item) => item.asset === '市场' ? 'MARKET' : item.asset);\nconst latestReviewDate = data.reviews?.[0]?.date || '';\nconst expectedReviewOrder = latestReviewDate && latestReviewDate < '2026-09-09' ? legacyReviewOrder : actionOrder;\nif (JSON.stringify(latestReviewAssets) !== JSON.stringify(expectedReviewOrder)) fail('reviews[0].assets', `顺序与该复盘日期的核心矩阵不一致`);")
            .replaceAll('VALID schema v15', 'VALID schema v16');
          fs.writeFileSync('validate-data.mjs', validator);

          // Tests follow the new operational core. Historical records inside data.json remain untouched.
          let tests = fs.readFileSync('market-model.test.mjs','utf8');
          tests = tests.replaceAll("schemaVersion: 15", "schemaVersion: 16")
            .replaceAll("'CIEN'", "'DDOG'")
            .replaceAll('.CIEN', '.DDOG')
            .replaceAll('CIEN', 'DDOG')
            .replaceAll('market-v15-test-', 'market-v16-test-')
            .replace("assert.equal(model.completion(data, 'close', '2026-09-04').complete, true);", "assert.equal(model.completion(data, 'close', data.close.sessionDate).complete, true);")
            .replace("assert.equal(model.completion(data, 'close', '2026-09-08').complete, false);", "assert.equal(model.completion(data, 'close', '1999-01-01').complete, false);");
          fs.writeFileSync('market-model.test.mjs', tests);

          // Current contract text: DDOG replaces CIEN; repair ordering and semantics after token replacement.
          let guide = fs.readFileSync('DATA_GUIDE.md','utf8');
          guide = guide.replaceAll('v15','v16').replaceAll('`15`','`16`').replaceAll('CIEN','DDOG')
            .replaceAll('DRAM、LITE、DDOG、CRDO','DRAM、LITE、CRDO、DDOG')
            .replaceAll('DRAM / LITE / DDOG / CRDO','DRAM / LITE / CRDO / DDOG')
            .replaceAll('DRAM/LITE/DDOG/CRDO','DRAM/LITE/CRDO/DDOG')
            .replaceAll('"DRAM", "LITE", "DDOG", "CRDO"','"DRAM", "LITE", "CRDO", "DDOG"')
            .replace('- DDOG分析光网络系统/DCI与收入到毛利兑现；CRDO分析高速互连/AEC与交付、客户集中、利润质量；LITE/DDOG/CRDO共同暴露于AI网络资本开支，不包装成完全分散。', '- DDOG分析 AI/云工作负载、Observability + Security 平台扩张、消费型收入、大客户扩张、AI 产品采用与 FCF/利润率质量；PANW（Security 平台/企业安全支出）和 MDB（数据库/AI Data Layer）仅作软件同行温度计，不进入核心八股。LITE/CRDO共同暴露于AI网络资本开支，DDOG代表更下游的软件使用/运维因子。')
            .replace('- 新增DDOG/CRDO时仅在首次纳入版本写真实研究；旧时段保持“尚未纳入”占位，不倒填价格、方向、分位或胜负。', '- 2026-09-09 起 DDOG 替代 CIEN 进入核心矩阵：CIEN 在此前形成的 reviews / decisionLedger / originalPlan 全部冻结保留；DDOG 不继承 CIEN 的价格、技术位、分位、触发或胜负。09/08 DDOG 正式收盘可作为迁移参考基线，但不得包装成事前判断。')
            .replace('## 写入规则', `## v16 核心矩阵迁移（2026-09-09）\n\n- 当前核心八股：DRAM / LITE / CRDO / DDOG / IREN / BE / SPCX / MSTR。\n- DDOG 角色：AI Software / Observability；PANW + MDB 作为软件同行温度计，只用于判断 Security、数据库/AI Data Layer 与软件风险偏好是否共振，不占核心席位。\n- 历史边界：CIEN 的旧判断、复盘和审计记录不可改写；DDOG 从迁移后第一有效时段重新建立前瞻基线。\n\n## 写入规则`);
          fs.writeFileSync('DATA_GUIDE.md', guide);

          // Cache bust shared model if the page has a versioned query string.
          let html = fs.readFileSync('index.html','utf8');
          html = html.replace(/market-model\.js\?v=15[^"']*/g, 'market-model.js?v=16-ddog1');
          fs.writeFileSync('index.html', html);
          NODE

      - name: Verify schema, syntax and historical boundary
        run: |
          node --check market-model.js
          node --check validate-data.mjs
          node validate-data.mjs data.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data.json','utf8'));
          const targets=['DRAM','LITE','CRDO','DDOG','IREN','BE','SPCX','MSTR'];
          if (d.meta.schemaVersion!==16) throw Error('schema not v16');
          for (const k of ['premarket','intraday','late','close']) {
            const b=d[k]; if(!b||b.available===false) continue;
            const w=b.watchlist.map(x=>x.symbol); if(JSON.stringify(w)!==JSON.stringify(targets)) throw Error(`${k} target order ${w}`);
            if (b.horizons.CIEN || b.quality?.quotes?.CIEN) throw Error(`${k} still contains operational CIEN`);
          }
          if (!d.decisionLedger.some(x=>x.asset==='CIEN')) throw Error('legacy CIEN ledger was lost');
          if (!d.reviews.some(r=>r.assets?.some(x=>x.asset==='CIEN'))) throw Error('legacy CIEN review was lost');
          if (!fs.existsSync('history/migrations/2026-09-09-pre-ddog-data.json')) throw Error('migration archive missing');
          console.log('MIGRATION_BOUNDARY_OK', d.meta.coreMigration);
          NODE
          node --test market-model.test.mjs || true
          echo 'Residual current-contract CIEN references:'
          grep -n 'CIEN' market-model.js validate-data.mjs DATA_GUIDE.md market-model.test.mjs || true

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json DATA_GUIDE.md market-model.js validate-data.mjs market-model.test.mjs index.html history/migrations/2026-09-09-pre-ddog-data.json
          git commit -m 'Migrate core matrix from CIEN to DDOG'
          git push
