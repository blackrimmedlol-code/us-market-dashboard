name: DDOG core migration

on:
  push:
    paths:
      - '.github/workflows/ddog-migration.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect CIEN field shapes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data.json','utf8'));
          const pick = (arr, field='asset') => arr?.find(x => x?.[field] === 'CIEN');
          const out = {
            meta:d.meta,
            close:{
              change:pick(d.close?.changes),
              horizon:d.close?.horizons?.CIEN,
              matrix:pick(d.close?.matrix),
              odds:d.close?.odds?.filter(x=>x?.asset==='CIEN'),
              snapshot:pick(d.close?.snapshot,'symbol'),
              watchlist:pick(d.close?.watchlist,'symbol'),
              quality:d.close?.quality?.quotes?.CIEN
            },
            premarket:{
              change:pick(d.premarket?.changes),
              horizon:d.premarket?.horizons?.CIEN,
              matrix:pick(d.premarket?.matrix),
              odds:d.premarket?.odds?.filter(x=>x?.asset==='CIEN'),
              snapshot:pick(d.premarket?.snapshot,'symbol'),
              watchlist:pick(d.premarket?.watchlist,'symbol'),
              quality:d.premarket?.quality?.quotes?.CIEN
            },
            mediumLedger:pick(d.mediumLedger),
            reviewCIEN:d.reviews?.[0]?.assets?.find(x=>x?.asset==='CIEN'),
            ledgerCIEN:d.decisionLedger?.filter(x=>x?.asset==='CIEN')
          };
          console.log(JSON.stringify(out,null,2));
          NODE
